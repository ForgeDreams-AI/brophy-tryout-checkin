<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brophy Soccer Tryouts - Check In</title>
<style>
* { box-sizing: border-box; }
body { font-family: -apple-system, Helvetica, Arial, sans-serif; margin: 0; background: #f4f4f4; color: #111; }
header { background: #a6192e; color: #fff; padding: 22px 16px; text-align: center; }
header h1 { margin: 0; font-size: 26px; }
header p { margin: 6px 0 0; font-size: 16px; opacity: .95; }
main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
.card { background: #fff; border-radius: 14px; padding: 22px 18px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
label { display: block; font-size: 18px; font-weight: 700; margin-bottom: 10px; }
input { width: 100%; font-size: 20px; padding: 14px; border: 2px solid #ccc; border-radius: 10px; }
input:focus { border-color: #a6192e; outline: none; }
.hint { color: #555; font-size: 14px; margin-top: 8px; }
button.checkin { width: 100%; margin-top: 20px; background: #1faa53; color: #fff; border: none; border-radius: 12px; font-size: 24px; font-weight: 800; padding: 18px; cursor: pointer; }
button.checkin:disabled { background: #9ccfae; cursor: default; }
button.secondary { width: 100%; margin-top: 14px; background: #eee; color: #111; border: none; border-radius: 10px; font-size: 16px; padding: 12px; cursor: pointer; }
#result { display: none; }
.namepill { display: inline-block; font-size: 24px; font-weight: 800; padding: 8px 14px; border-radius: 10px; }
.name-green { background: #1faa53; color: #fff; }
.name-yellow { background: #f5c518; color: #111; }
.name-red { background: #d92b2b; color: #fff; }
.ok { font-weight: 700; font-size: 16px; margin: 12px 0 4px; color: #444; }
.row { border-top: 1px solid #eee; padding: 14px 0; }
.row .k { font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: #777; }
.row .v { font-size: 24px; font-weight: 800; margin-top: 2px; }
.row .s { font-size: 16px; color: #444; }
#error { display: none; color: #a6192e; font-weight: 700; margin-top: 12px; }
</style>
</head>

<p>November 2&ndash;5, 2026 &middot; Check in to see your teams</p>
</header>

<p class="hint">Pick your name from the list, then tap Check In.</p>
<div id="error">That name is not on the tryout list. Check your spelling or pick a name from the list.</div>
<button class="checkin" id="go" disabled>CHECK IN</button>
</div>
<div class="card" id="result">
<span class="namepill" id="rname"></span>
<div class="ok" id="rtime"></div>
<div id="assign"></div>
<button class="secondary" id="change">Not your name? Change it</button>

var input = document.getElementById('name');
var go = document.getElementById('go');
var err = document.getElementById('error');
var dl = document.getElementById('names');
Object.keys(DATA).sort().forEach(function(n) {
  var o = document.createElement('option'); o.value = n; dl.appendChild(o);
});
function valid() { return DATA.hasOwnProperty(input.value.trim()); }
input.addEventListener('input', function() {
  go.disabled = !valid();
  err.style.display = 'none';
});
function statusFor(d) {
  var mins = d.getHours() * 60 + d.getMinutes();
  if (mins < 15 * 60 + 10) return 'green';
  if (mins <= 15 * 60 + 30) return 'yellow';
  return 'red';
}
function statusWord(s) {
  return s === 'green' ? 'On time' : (s === 'yellow' ? 'Late' : 'Very late');
}
function fmtTime(d) {
  var h = d.getHours(), m = d.getMinutes(), ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  return h + ':' + (m < 10 ? '0' + m : m) + ' ' + ap;
}
function show(name, when, status) {
  var d = DATA[name];
  var pill = document.getElementById('rname');
  pill.textContent = name;
  pill.className = 'namepill name-' + status;
  document.getElementById('rtime').textContent = 'Checked in ' + fmtTime(when) + ' · ' + statusWord(status);
  var a = document.getElementById('assign');
  if (d.gk) {
    a.innerHTML = '<div class="row"><div class="k">Assignment</div><div class="v">Goalkeeper</div><div class="s">Goalkeepers are not on field teams. Check in with a coach for your session.</div></div>';
  } else {
    a.innerHTML =
      '<div class="row"><div class="k">Session 1 &middot; Big field</div><div class="v">' + d.big + '</div></div>' +
      '<div class="row"><div class="k">Session 2 &middot; Small-sided games</div><div class="v">' + d.small + '</div><div class="s">' + d.field + ' &middot; Three teams per field: two play, one sits out.</div></div>' +
      '<div class="row"><div class="k">Session 3 &middot; Timed 2-mile run</div><div class="v">' + d.run + '</div><div class="s">Start time: ' + d.start + ' minutes into the station.</div></div>';
  }
  document.getElementById('form').style.display = 'none';
  document.getElementById('result').style.display = 'block';
}
function saveCheckin(name, when, status) {
  try { localStorage.setItem('brophy-checkin', JSON.stringify({name: name, time: when.toISOString(), status: status})); } catch (e) {}
}
go.addEventListener('click', function() {
  var name = input.value.trim();
  if (!valid()) { err.style.display = 'block'; return; }
  var now = new Date();
  var status = statusFor(now);
  saveCheckin(name, now, status);
  show(name, now, status);
});
document.getElementById('change').addEventListener('click', function() {
  try { localStorage.removeItem('brophy-checkin'); } catch (e) {}
  document.getElementById('result').style.display = 'none';
  document.getElementById('form').style.display = 'block';
  input.value = ''; go.disabled = true; input.focus();
});
try {
  var saved = localStorage.getItem('brophy-checkin');
  if (saved) {
    var rec = JSON.parse(saved);
    if (rec && rec.name && DATA.hasOwnProperty(rec.name)) {
      input.value = rec.name;
      show(rec.name, new Date(rec.time), rec.status);
    }
  }
} catch (e) {}
